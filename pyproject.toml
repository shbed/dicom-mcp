[project]
name = "dicom-mcp"
version = "0.1.0"
description = "MCP server exposing local DICOM studies (metadata, headers, rendered slices) to local LLMs"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2",
    "pydicom>=3.0",
    "pillow>=10",
    "numpy>=1.24",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.0",
    "pylibjpeg-openjpeg>=2.0",
]

[project.scripts]
dicom-mcp = "dicom_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dicom_mcp"]
